apiVersion: v1
kind: Namespace
metadata:
  name: graphwan
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: graphwan-ingress-bridge
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      log_format upstream_check '$http_x_graphwan_probe status=$status upstream=$upstream_addr upstream_status=$upstream_status';
      map $http_x_graphwan_probe $log_probe { default 0; ~^graphwan-check- 1; }
      access_log /dev/stdout upstream_check if=$log_probe;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }
      server {
        listen __NODE_IP__:19099;
        server_name _;
        client_max_body_size 10m;
        location / {
          proxy_pass https://127.0.0.1:8443;
          proxy_ssl_verify off;
          proxy_ssl_server_name on;
          proxy_ssl_name $host;
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
          proxy_buffering off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: graphwan-ingress-bridge
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: graphwan-ingress-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphwan-ingress-bridge
      annotations:
        checksum/config: 28fe52963ba52c2420b0c2c40687db22424e7e0a50596ff72c1f07c91d2e464b
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: docker.io/library/nginx@sha256:bf3201ab56f23e5954646379c775d511fc466e9f11376d9725361064ad07ed35
        command:
        - /bin/sh
        - -ec
        args:
        - sed "s/__NODE_IP__/${NODE_IP}/g" /etc/nginx/template.conf > /tmp/nginx.conf;
          exec nginx -c /tmp/nginx.conf -g "daemon off;"
        ports:
        - name: http
          containerPort: 19099
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 128Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/template.conf
          subPath: nginx.conf
          readOnly: true
        - name: tmp
          mountPath: /tmp
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
      volumes:
      - name: config
        configMap:
          name: graphwan-ingress-bridge
      - name: tmp
        emptyDir: {}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - yihao-pve-debian
                - ali-sas
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
---
apiVersion: v1
kind: Service
metadata:
  name: graphwan-public
  annotations:
    traefik.ingress.kubernetes.io/service.nativelb: 'true'
spec:
  trafficDistribution: PreferSameNode
  selector:
    app.kubernetes.io/name: graphwan-ingress-bridge
  ports:
  - name: http
    port: 80
    targetPort: http
  internalTrafficPolicy: Local
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graphwan-public
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    networking.yhzone.top/publish-dns: 'true'
  labels:
    networking.yhzone.top/exposure: public
spec:
  ingressClassName: traefik-public
  tls:
  - hosts:
    - graphwan.yhzone.top
    secretName: graphwan-public-tls
  rules:
  - host: graphwan.yhzone.top
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: graphwan-public
            port:
              number: 80
