# Full defaults from upstream harbor 1.19.2, with yihao overrides.
expose:
  type: clusterIP
  tls:
    enabled: false
    certSource: auto
    auto:
      commonName: ''
    secret:
      secretName: ''
  ingress:
    hosts:
      core: core.harbor.domain
    controller: default
    kubeVersionOverride: ''
    className: ''
    annotations:
      ingress.kubernetes.io/ssl-redirect: 'true'
      ingress.kubernetes.io/proxy-body-size: '0'
      nginx.ingress.kubernetes.io/ssl-redirect: 'true'
      nginx.ingress.kubernetes.io/proxy-body-size: '0'
    labels: {}
  route:
    labels: {}
    annotations: {}
    parentRefs: []
    hosts: []
  clusterIP:
    name: harbor
    staticClusterIP: ''
    ports:
      httpPort: 80
      httpsPort: 443
    annotations: {}
    labels: {}
  nodePort:
    name: harbor
    ports:
      http:
        port: 80
        nodePort: 30002
      https:
        port: 443
        nodePort: 30003
    annotations: {}
    labels: {}
  loadBalancer:
    name: harbor
    IP: ''
    ports:
      httpPort: 80
      httpsPort: 443
    annotations: {}
    labels: {}
    sourceRanges: []
externalURL: https://harbor.yhzone.top
persistence:
  enabled: true
  resourcePolicy: keep
  persistentVolumeClaim:
    registry:
      existingClaim: ''
      storageClass: yihao-local
      subPath: ''
      accessMode: ReadWriteOnce
      size: 30Gi
      annotations: {}
    jobservice:
      jobLog:
        existingClaim: ''
        storageClass: yihao-local
        subPath: ''
        accessMode: ReadWriteOnce
        size: 1Gi
        annotations: {}
    database:
      existingClaim: ''
      storageClass: ''
      subPath: ''
      accessMode: ReadWriteOnce
      size: 1Gi
      annotations: {}
    redis:
      existingClaim: ''
      storageClass: yihao-local
      subPath: ''
      accessMode: ReadWriteOnce
      size: 1Gi
      annotations: {}
    trivy:
      existingClaim: ''
      storageClass: ''
      subPath: ''
      accessMode: ReadWriteOnce
      size: 5Gi
      annotations: {}
  imageChartStorage:
    disableredirect: false
    type: filesystem
    filesystem:
      rootdirectory: /storage
    azure:
      accountname: accountname
      accountkey: base64encodedaccountkey
      container: containername
      existingSecret: ''
    gcs:
      bucket: bucketname
      encodedkey: base64-encoded-json-key-file
      existingSecret: ''
      useWorkloadIdentity: false
    s3:
      region: us-west-1
      bucket: bucketname
    swift:
      authurl: https://storage.myprovider.com/v3/auth
      username: username
      password: password
      container: containername
      existingSecret: ''
    oss:
      accesskeyid: accesskeyid
      accesskeysecret: accesskeysecret
      region: regionname
      bucket: bucketname
      existingSecret: ''
existingSecretAdminPassword: harbor-bootstrap
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
harborAdminPassword: Harbor12345
internalTLS:
  enabled: false
  strong_ssl_ciphers: false
  certSource: auto
  trustCa: ''
  core:
    secretName: ''
    crt: ''
    key: ''
  jobservice:
    secretName: ''
    crt: ''
    key: ''
  registry:
    secretName: ''
    crt: ''
    key: ''
  portal:
    secretName: ''
    crt: ''
    key: ''
  trivy:
    secretName: ''
    crt: ''
    key: ''
ipFamily:
  ipv6:
    enabled: true
  ipv4:
    enabled: true
  policy: ''
  families: []
imagePullPolicy: IfNotPresent
imagePullSecrets: null
updateStrategy:
  type: Recreate
logLevel: info
caSecretName: ''
secretKey: not-a-secure-key
existingSecretSecretKey: harbor-bootstrap
proxy:
  httpProxy: null
  httpsProxy: null
  noProxy: 127.0.0.1,localhost,.local,.internal
  components:
  - core
  - jobservice
  - trivy
enableMigrateHelmHook: false
metrics:
  enabled: false
  core:
    path: /metrics
    port: 8001
  registry:
    path: /metrics
    port: 8001
  jobservice:
    path: /metrics
    port: 8001
  exporter:
    path: /metrics
    port: 8001
  serviceMonitor:
    enabled: false
    additionalLabels: {}
    interval: ''
    metricRelabelings: []
    relabelings: []
trace:
  enabled: false
  provider: jaeger
  sample_rate: 1
  jaeger:
    endpoint: http://hostname:14268/api/traces
  otel:
    endpoint: hostname:4318
    url_path: /v1/traces
    compression: false
    insecure: true
    timeout: 10
cache:
  enabled: false
  expireHours: 24
containerSecurityContext:
  privileged: false
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
  runAsNonRoot: true
  capabilities:
    drop:
    - ALL
nginx:
  image:
    repository: docker.io/goharbor/nginx-photon
    tag: v2.15.2
  serviceAccountName: ''
  automountServiceAccountToken: false
  replicas: 1
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  revisionHistoryLimit: 10
  extraEnvVars: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
  podLabels: {}
  priorityClassName: null
  livenessProbe:
    initialDelaySeconds: 300
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    initialDelaySeconds: 1
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1
portal:
  image:
    repository: docker.io/goharbor/harbor-portal
    tag: v2.15.2
  serviceAccountName: ''
  automountServiceAccountToken: false
  replicas: 1
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  revisionHistoryLimit: 10
  extraEnvVars: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
  podLabels: {}
  serviceAnnotations: {}
  priorityClassName: null
  livenessProbe:
    initialDelaySeconds: 300
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    initialDelaySeconds: 1
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1
  initContainers: []
core:
  image:
    repository: docker.io/goharbor/harbor-core
    tag: v2.15.2
  serviceAccountName: ''
  automountServiceAccountToken: false
  replicas: 1
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  revisionHistoryLimit: 10
  startupProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 360
    successThreshold: 1
  livenessProbe:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 2
    successThreshold: 1
  readinessProbe:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 2
    successThreshold: 1
  extraEnvVars: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
  podLabels: {}
  serviceAnnotations: {}
  priorityClassName: null
  initContainers: []
  configureUserSettings: null
  quotaUpdateProvider: db
  secret: ''
  existingSecret: harbor-bootstrap
  secretName: harbor-token-signing
  tokenKey: ''
  tokenCert: ''
  xsrfKey: ''
  existingXsrfSecret: harbor-bootstrap
  existingXsrfSecretKey: CSRF_KEY
  artifactPullAsyncFlushDuration: null
  gdpr:
    deleteUser: false
    auditLogsCompliant: false
jobservice:
  image:
    repository: docker.io/goharbor/harbor-jobservice
    tag: v2.15.2
  replicas: 1
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  revisionHistoryLimit: 10
  serviceAccountName: ''
  automountServiceAccountToken: false
  livenessProbe:
    initialDelaySeconds: 300
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1
  extraEnvVars: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: null
  podAnnotations: {}
  podLabels: {}
  priorityClassName: null
  initContainers: []
  maxJobWorkers: 10
  jobLoggers:
  - file
  loggerSweeperDuration: 14
  notification:
    webhook_job_max_retry: 3
    webhook_job_http_client_timeout: 3
  reaper:
    max_update_hours: 24
    max_dangling_hours: 168
  secret: ''
  existingSecret: harbor-bootstrap
  existingSecretKey: JOBSERVICE_SECRET
  registryHttpClientTimeout: 30
registry:
  registry:
    image:
      repository: docker.io/goharbor/registry-photon
      tag: v2.15.2
    extraEnvVars: []
    livenessProbe:
      initialDelaySeconds: 300
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
      successThreshold: 1
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
      successThreshold: 1
  controller:
    image:
      repository: docker.io/goharbor/harbor-registryctl
      tag: v2.15.2
    extraEnvVars: []
    livenessProbe:
      initialDelaySeconds: 300
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
      successThreshold: 1
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
      successThreshold: 1
  serviceAccountName: ''
  automountServiceAccountToken: false
  replicas: 1
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  revisionHistoryLimit: 10
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
  podLabels: {}
  priorityClassName: null
  initContainers: []
  secret: ''
  existingSecret: harbor-bootstrap
  existingSecretKey: REGISTRY_HTTP_SECRET
  relativeurls: false
  credentials:
    username: harbor_registry_user
    password: harbor_registry_password
    existingSecret: harbor-bootstrap
    htpasswdString: ''
  middleware:
    enabled: false
    type: cloudFront
    cloudFront:
      baseurl: example.cloudfront.net
      keypairid: KEYPAIRID
      duration: 3000s
      ipfilteredby: none
      privateKeySecret: my-secret
  upload_purging:
    enabled: true
    age: 168h
    interval: 24h
    dryrun: false
trivy:
  enabled: false
  image:
    repository: docker.io/goharbor/trivy-adapter-photon
    tag: v2.15.2
  serviceAccountName: ''
  automountServiceAccountToken: false
  replicas: 1
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  livenessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 10
    successThreshold: 1
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1
  extraEnvVars: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
  podLabels: {}
  priorityClassName: null
  initContainers: []
  debugMode: false
  vulnType: os,library
  severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
  ignoreUnfixed: false
  insecure: false
  gitHubToken: ''
  skipUpdate: false
  skipJavaDBUpdate: false
  dbRepository:
  - mirror.gcr.io/aquasec/trivy-db
  - ghcr.io/aquasecurity/trivy-db
  javaDBRepository:
  - mirror.gcr.io/aquasec/trivy-java-db
  - ghcr.io/aquasecurity/trivy-java-db
  offlineScan: false
  securityCheck: vuln
  timeout: 5m0s
database:
  type: external
  internal:
    image:
      repository: docker.io/goharbor/harbor-db
      tag: v2.15.2
    serviceAccountName: ''
    automountServiceAccountToken: false
    livenessProbe:
      initialDelaySeconds: 300
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
      successThreshold: 1
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
      successThreshold: 1
    extraEnvVars: []
    nodeSelector: {}
    tolerations: []
    affinity: {}
    priorityClassName: null
    extrInitContainers: []
    password: changeit
    shmSizeLimit: 512Mi
    initContainer:
      migrator: {}
      permissions: {}
  external:
    host: harbor-postgresql
    port: '5432'
    username: postgres
    password: password
    coreDatabase: registry
    existingSecret: harbor-bootstrap
    sslmode: disable
  maxIdleConns: 100
  maxOpenConns: 900
  podAnnotations: {}
  podLabels: {}
redis:
  type: internal
  internal:
    image:
      repository: docker.io/goharbor/valkey-photon
      tag: v2.15.2
    serviceAccountName: ''
    automountServiceAccountToken: false
    livenessProbe:
      initialDelaySeconds: 300
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
      successThreshold: 1
    readinessProbe:
      initialDelaySeconds: 1
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
      successThreshold: 1
    extraEnvVars: []
    nodeSelector: {}
    tolerations: []
    affinity: {}
    priorityClassName: null
    initContainers: []
    jobserviceDatabaseIndex: '1'
    registryDatabaseIndex: '2'
    trivyAdapterIndex: '5'
  external:
    addr: 192.168.0.2:6379
    sentinelMasterSet: ''
    tlsOptions:
      enable: false
    coreDatabaseIndex: '0'
    jobserviceDatabaseIndex: '1'
    registryDatabaseIndex: '2'
    trivyAdapterIndex: '5'
    username: ''
    password: ''
    existingSecret: ''
  podAnnotations: {}
  podLabels: {}
exporter:
  image:
    repository: docker.io/goharbor/harbor-exporter
    tag: v2.15.2
