apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harbor
  namespace: harbor
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    dns.yhzone.top/managed: 'true'
    external-dns.kubernetes.io/target: 10.1.2.4
    external-dns.kubernetes.io/ttl: '300'
    external-dns.kubernetes.io/cloudflare-proxied: 'false'
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - harbor.k8s.yhzone.top
    - harbor.yhzone.top
    secretName: harbor-ingress-tls
  rules:
  - host: harbor.k8s.yhzone.top
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: harbor
            port:
              number: 80
  - host: harbor.yhzone.top
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: harbor
            port:
              number: 80
