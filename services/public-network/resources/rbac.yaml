apiVersion: v1
kind: ServiceAccount
metadata:
  name: public-network-controller
  namespace: public-network
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yihao-public-network-controller
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
  - patch
- apiGroups:
  - ''
  resources:
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cert-manager.io
  resources:
  - certificates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.yhzone.top
  resources:
  - nodepublicipv6s
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.yhzone.top
  resources:
  - nodepublicipv6s/status
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: yihao-public-network-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: yihao-public-network-controller
subjects:
- kind: ServiceAccount
  name: public-network-controller
  namespace: public-network
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: public-network-controller
  namespace: public-network
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - create
  - patch
- apiGroups:
  - externaldns.k8s.io
  resources:
  - dnsendpoints
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: public-network-controller
  namespace: public-network
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: public-network-controller
subjects:
- kind: ServiceAccount
  name: public-network-controller
  namespace: public-network
