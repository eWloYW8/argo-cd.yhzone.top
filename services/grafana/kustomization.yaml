apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana
resources:
- resources/namespace.yaml
- resources/ingress.yaml
helmCharts:
- name: grafana
  repo: https://grafana-community.github.io/helm-charts
  version: 13.2.5
  releaseName: grafana
  namespace: grafana
  valuesFile: values/grafana-13.2.5.yaml
components:
- ../../components/image-prefix
configMapGenerator:
- name: grafana-dashboards
  files:
  - dashboards/nodes.json
  - dashboards/workloads.json
generatorOptions:
  disableNameSuffixHash: true
