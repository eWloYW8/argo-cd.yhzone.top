apiVersion: v1
kind: ConfigMap
metadata:
  name: pigapi-config
data:
  config.json: |
    {
      "listen": "0.0.0.0:8080",
      "admin_listen": "0.0.0.0:8081",
      "llm_public_url": "https://{{ .Values.host }}:20443",
      "state_database_url": "postgres://pigapi@postgres:5432/pigapi?sslmode=disable",
      "state_database_password_file": "/run/secrets/postgres_password",
      "max_request_bytes": 134217728,
      "clickhouse": {
        "url": "http://clickhouse:8123",
        "database": "pigapi",
        "username": "pigapi",
        "password_file": "/run/secrets/clickhouse_password"
      },
      "services": [],
      "organizations": [],
      "analysis": {
        "public_url": "https://{{ .Values.host }}:20443",
        "session_secret_file": "/run/secrets/session_secret",
        "bootstrap_token_file": "/run/secrets/bootstrap_token"
      }
    }
