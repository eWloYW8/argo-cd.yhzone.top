{{- range .Values.hops }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
data:
  tcp.yaml: |
    tcp:
      routers:
        forward:
          entryPoints: [forward]
          rule: "HostSNI(`*`)"
          service: forward
      services:
        forward:
          loadBalancer:
            servers:
            - address: {{ .backend | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $.Release.Name }}-{{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $.Release.Name }}-{{ .name }}
      annotations:
        checksum/config: {{ . | toJson | sha256sum }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/hostname: {{ .nodeName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: tcp-forward
        image: {{ $.Values.image | quote }}
        imagePullPolicy: IfNotPresent
        args:
        - --entrypoints.forward.address={{ .listenAddress }}/tcp
        - --entrypoints.health.address=127.0.0.1:{{ $.Values.healthPort }}/tcp
        - --ping=true
        - --ping.entrypoint=health
        - --providers.file.filename=/config/tcp.yaml
        - --providers.file.watch=true
        - --global.checknewversion=false
        - --global.sendanonymoususage=false
        env:
        - name: GOMEMLIMIT
          value: 80MiB
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          {{- toYaml $.Values.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            host: 127.0.0.1
            port: {{ $.Values.healthPort }}
            path: /ping
          periodSeconds: 5
        livenessProbe:
          httpGet:
            host: 127.0.0.1
            port: {{ $.Values.healthPort }}
            path: /ping
          initialDelaySeconds: 15
          periodSeconds: 15
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: {{ $.Release.Name }}-{{ .name }}
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
{{- end }}
