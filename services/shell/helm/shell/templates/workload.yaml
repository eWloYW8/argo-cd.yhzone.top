apiVersion: apps/v1
kind: Deployment
metadata:
  name: shell
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: shell
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shell
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.node }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: {{ .Values.image }}
        command: [nginx]
        args: ['-g', 'daemon off;']
        ports:
        - name: http
          containerPort: 8080
        - name: health
          containerPort: 8081
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
        volumeMounts:
        - name: files
          mountPath: /srv/files
          readOnly: true
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: files
        persistentVolumeClaim:
          claimName: shell-files
      - name: config
        configMap:
          name: shell-nginx
      - name: tmp
        emptyDir: {}
