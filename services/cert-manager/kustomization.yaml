# Helm defines namespaces; leave ClusterIssuer cluster-scoped.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- resources
helmCharts:
- name: cert-manager
  repo: https://charts.jetstack.io
  version: v1.21.2
  releaseName: cert-manager
  namespace: cert-manager
  includeCRDs: true
  valuesFile: values/cert-manager-v1.21.2.yaml
