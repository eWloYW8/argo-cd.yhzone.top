apiVersion: v1
kind: Namespace
metadata:
  name: mihomo
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mihomo-ingress-bridge
data:
  nginx.conf: "worker_processes 1;\npid /tmp/nginx.pid;\nerror_log /dev/stderr warn;\n\
    events { worker_connections 1024; }\nhttp {\n  access_log off;\n  client_body_temp_path\
    \ /tmp/client_temp;\n  proxy_temp_path /tmp/proxy_temp;\n  map $http_upgrade $connection_upgrade\
    \ {\n    default upgrade;\n    '' close;\n  }\n  server {\n    listen 10.1.2.4:19098;\n\
    \    server_name _;\n    client_max_body_size 10m;\n    location / {\n      proxy_pass\
    \ http://127.0.0.1:19097;\n      proxy_http_version 1.1;\n      proxy_set_header\
    \ Host $http_host;\n      proxy_set_header Upgrade $http_upgrade;\n      proxy_set_header\
    \ Connection $connection_upgrade;\n      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
    \      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;\n      proxy_buffering\
    \ off;\n      proxy_read_timeout 3600s;\n      proxy_send_timeout 3600s;\n   \
    \ }\n  }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mihomo-ingress-bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: mihomo-ingress-bridge
  template:
    metadata:
      labels: *id001
    spec:
      nodeSelector:
        kubernetes.io/hostname: yihao-pve-debian
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: docker.io/library/nginx@sha256:bf3201ab56f23e5954646379c775d511fc466e9f11376d9725361064ad07ed35
        command:
        - nginx
        args:
        - -g
        - daemon off;
        ports:
        - name: http
          containerPort: 19098
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 128Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /ui/
            port: http
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: mihomo-ingress-bridge
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mihomo-public
  annotations:
    traefik.ingress.kubernetes.io/service.nativelb: 'true'
spec:
  trafficDistribution: PreferSameNode
  selector:
    app.kubernetes.io/name: mihomo-ingress-bridge
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mihomo-public
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    networking.yhzone.top/publish-dns: 'true'
spec:
  ingressClassName: traefik-public
  tls:
  - hosts:
    - mihomo.d.yhzone.top
    secretName: mihomo-public-tls
  rules:
  - host: mihomo.d.yhzone.top
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mihomo-public
            port:
              number: 80
