apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
data:
  udp.yaml: |
    udp:
      routers:
        hysteria:
          entryPoints: [hysteria]
          service: hysteria
      services:
        hysteria:
          loadBalancer:
            servers:
            - address: {{ .Values.backend | quote }}
{{- with .Values.tcpForward }}
    tcp:
      routers:
        forward:
          entryPoints: [forward]
          rule: "HostSNI(`*`)"
          service: forward
      services:
        forward:
          loadBalancer:
            servers:
            - address: {{ .backend | quote }}
{{- end }}
