apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: traefik-udp
        image: {{ .Values.image | quote }}
        imagePullPolicy: IfNotPresent
        args:
        - --entrypoints.hysteria.address=0.0.0.0:{{ .Values.listenPort }}/udp
        - --entrypoints.hysteria.udp.timeout={{ .Values.sessionTimeout }}
        - --entrypoints.health.address=127.0.0.1:18082/tcp
        - --ping=true
        - --ping.entrypoint=health
        - --providers.file.filename=/config/udp.yaml
        - --providers.file.watch=true
        - --global.checknewversion=false
        - --global.sendanonymoususage=false
        env:
        - name: GOMEMLIMIT
          value: 80MiB
        ports:
        - name: hysteria
          containerPort: {{ .Values.listenPort }}
          hostPort: {{ .Values.listenPort }}
          protocol: UDP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            host: 127.0.0.1
            port: 18082
            path: /ping
          periodSeconds: 5
        livenessProbe:
          httpGet:
            host: 127.0.0.1
            port: 18082
            path: /ping
          initialDelaySeconds: 15
          periodSeconds: 15
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: {{ .Release.Name }}
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
