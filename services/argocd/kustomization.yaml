apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
- resources/namespace.yaml
- resources
components:
- ../../components/image-prefix
patches:
- target:
    group: apps
    version: v1
    kind: Deployment|StatefulSet
  patch: |-
    - op: add
      path: /spec/template/spec/nodeSelector/node.yhzone.top~1role
      value: core
