apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    dns.yhzone.top/managed: 'true'
    external-dns.kubernetes.io/target: 10.1.2.4
    external-dns.kubernetes.io/ttl: '300'
    external-dns.kubernetes.io/cloudflare-proxied: 'false'
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - argocd.k8s.yhzone.top
    - argo-cd.k8s.yhzone.top
    secretName: argocd-ingress-tls
  rules:
  - host: argocd.k8s.yhzone.top
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 80
  - host: argo-cd.k8s.yhzone.top
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 80
