# Secret dependency inventory only: no values. Business Secrets are now managed by the private repository.
secrets:
- namespace: ascend-compiler-explorer
  name: harbor-pull
  type: kubernetes.io/dockerconfigjson
  requiredKeys:
  - .dockerconfigjson
- namespace: cert-manager
  name: cloudflare-api-token
  type: Opaque
  requiredKeys:
  - api-token
- namespace: easytier-web
  name: harbor-pull
  type: kubernetes.io/dockerconfigjson
  requiredKeys:
  - .dockerconfigjson
- namespace: easytier-web
  name: public-basic-auth
  type: Opaque
  requiredKeys:
  - users
- namespace: easytier-web
  name: runtime-env
  type: Opaque
  requiredKeys:
  - TZ
  - WEB_API_PORT
  - WEB_DEFAULT_API_HOST
  - WEB_LOG_LEVEL
  - WEB_PORT
  - WEB_SERVER_PORT
  - WEB_SERVER_PROTOCOL
- namespace: external-dns
  name: cloudflare-api-token
  type: Opaque
  requiredKeys:
  - api-token
- namespace: funasr-nano
  name: harbor-pull
  type: kubernetes.io/dockerconfigjson
  requiredKeys:
  - .dockerconfigjson
- namespace: funasr-nano
  name: runtime-env
  type: Opaque
  requiredKeys:
  - FUNASR_ALLOW_QUERY_TOKEN
  - FUNASR_API_KEY
  - FUNASR_BINARY
  - FUNASR_ENCODER_MODEL
  - FUNASR_HOST
  - FUNASR_INFERENCE_TIMEOUT_SECONDS
  - FUNASR_LLM_MODEL
  - FUNASR_MAX_BUFFER_SECONDS
  - FUNASR_MAX_CONCURRENT_INFERENCES
  - FUNASR_MAX_SESSION_SECONDS
  - FUNASR_MAX_TOKENS
  - FUNASR_MIN_FINAL_SECONDS
  - FUNASR_PORT
  - FUNASR_REPETITION_PENALTY
  - FUNASR_SAMPLE_RATE
  - FUNASR_STREAM_CHUNK_SECONDS
  - OMP_NUM_THREADS
- namespace: harbor
  name: harbor-bootstrap
  type: Opaque
  requiredKeys:
  - CSRF_KEY
  - HARBOR_ADMIN_PASSWORD
  - JOBSERVICE_SECRET
  - POSTGRES_PASSWORD
  - REGISTRY_HTPASSWD
  - REGISTRY_HTTP_SECRET
  - REGISTRY_PASSWD
  - password
  - secret
  - secretKey
- namespace: harbor
  name: harbor-token-signing
  type: kubernetes.io/tls
  requiredKeys:
  - tls.crt
  - tls.key
- namespace: hysteria2
  name: harbor-pull
  type: kubernetes.io/dockerconfigjson
  requiredKeys:
  - .dockerconfigjson
- namespace: hysteria2
  name: hysteria2-config
  type: Opaque
  requiredKeys:
  - config.yaml
- namespace: neverrun
  name: harbor-pull
  type: kubernetes.io/dockerconfigjson
  requiredKeys:
  - .dockerconfigjson
- namespace: neverrun
  name: public-basic-auth
  type: Opaque
  requiredKeys:
  - users
- namespace: new-api
  name: harbor-pull
  type: kubernetes.io/dockerconfigjson
  requiredKeys:
  - .dockerconfigjson
- namespace: new-api
  name: postgres-env
  type: Opaque
  requiredKeys:
  - POSTGRES_DB
  - POSTGRES_PASSWORD
  - POSTGRES_USER
- namespace: new-api
  name: redis-env
  type: Opaque
  requiredKeys:
  - REDIS_PASSWORD
- namespace: new-api
  name: runtime-env
  type: Opaque
  requiredKeys:
  - BATCH_UPDATE_ENABLED
  - ERROR_LOG_ENABLED
  - FRONTEND_BASE_URL
  - GLOBAL_API_RATE_LIMIT
  - GLOBAL_WEB_RATE_LIMIT_ENABLE
  - NODE_NAME
  - REDIS_CONN_STRING
  - SQL_DSN
  - TZ
- namespace: subcon
  name: harbor-pull
  type: kubernetes.io/dockerconfigjson
  requiredKeys:
  - .dockerconfigjson
- namespace: vaultwarden
  name: harbor-pull
  type: kubernetes.io/dockerconfigjson
  requiredKeys:
  - .dockerconfigjson
- namespace: vaultwarden
  name: runtime-env
  type: Opaque
  requiredKeys:
  - ROCKET_ENV
  - SIGNUPS_ALLOWED
- namespace: zhiyun-tools
  name: harbor-pull
  type: kubernetes.io/dockerconfigjson
  requiredKeys:
  - .dockerconfigjson
- namespace: zhiyun-tools
  name: public-basic-auth
  type: Opaque
  requiredKeys:
  - users
- namespace: zhiyun-tools
  name: runtime-env
  type: Opaque
  requiredKeys:
  - RUST_LOG
- namespace: zju-autosign
  name: autosign-env
  type: Opaque
  requiredKeys:
  - DINGTALK_SECRET
  - DINGTALK_WEBHOOK
  - ENABLE_DINGTALK
  - ZJU_PASSWORD
  - ZJU_USERNAME
- namespace: zju-autosign
  name: harbor-pull
  type: kubernetes.io/dockerconfigjson
  requiredKeys:
  - .dockerconfigjson
- namespace: zjulibbooking
  name: harbor-pull
  type: kubernetes.io/dockerconfigjson
  requiredKeys:
  - .dockerconfigjson
- namespace: zjulibbooking
  name: public-basic-auth
  type: Opaque
  requiredKeys:
  - users
managedBy:
  application: yihao-secrets
  repository: git@github.com:eWloYW8/argo-cd-secrets.yhzone.top.git
bootstrapSecrets:
- namespace: argocd
  name: yihao-secrets-git-repository
  type: Opaque
  requiredKeys:
  - type
  - url
  - sshPrivateKey
