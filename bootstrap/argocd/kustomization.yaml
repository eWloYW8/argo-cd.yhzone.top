apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
- https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.3/manifests/install.yaml
patches:
- target:
    kind: ConfigMap
    name: argocd-cmd-params-cm
  patch: "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: argocd-cmd-params-cm\n\
    data:\n  server.insecure: \"true\"\n"
- target:
    kind: Deployment
    name: argocd-server
  patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: argocd-server\n\
    spec:\n  template:\n    metadata:\n      annotations:\n        yihao.top/tls-termination:\
    \ caddy\n"
