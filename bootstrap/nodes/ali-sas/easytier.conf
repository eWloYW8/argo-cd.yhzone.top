[Unit]
Wants=easytier.service
After=easytier.service network-online.target

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do ip -4 addr show dev tun0 2>/dev/null | grep -q "inet 10.1.2.2/" && exit 0; sleep 1; done; exit 1'
ExecStartPre=/bin/sh -c '/usr/sbin/iptables -C INPUT ! -i tun0 -p udp --dport 8472 -j DROP 2>/dev/null || /usr/sbin/iptables -I INPUT ! -i tun0 -p udp --dport 8472 -j DROP'
ExecStartPre=/bin/sh -c '/usr/sbin/iptables -C INPUT -i eth0 -p tcp --dport 10250 -j DROP 2>/dev/null || /usr/sbin/iptables -I INPUT -i eth0 -p tcp --dport 10250 -j DROP'
ExecStartPre=/bin/sh -c '/usr/sbin/ip6tables -C INPUT -i eth0 -p tcp --dport 10250 -j DROP 2>/dev/null || /usr/sbin/ip6tables -I INPUT -i eth0 -p tcp --dport 10250 -j DROP'
