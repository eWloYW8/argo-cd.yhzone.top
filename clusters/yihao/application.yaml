apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yihao
  namespace: argocd
spec:
  project: yihao
  source:
    repoURL: https://github.com/eWloYW8/argo-cd.yhzone.top.git
    targetRevision: main
    path: clusters/yihao
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
