apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: caddy-internal
  namespace: argocd
spec:
  project: yihao
  source:
    repoURL: https://github.com/eWloYW8/argo-cd.yhzone.top.git
    targetRevision: main
    path: platform/caddy
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-certificates
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
